<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat Catalogue AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        * { font-family: 'Poppins', sans-serif; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-50">
    
    <header class="bg-gradient-to-r from-blue-600 to-purple-600 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold"><i class="fas fa-store"></i> Bharat AI</h1>
            <button onclick="showShopProfile()" class="bg-white text-blue-600 px-3 py-1 rounded text-sm font-semibold">
                <i class="fas fa-user"></i> दुकान
            </button>
        </div>
    </header>

    <div class="container mx-auto p-4 max-w-2xl">
        
        <div id="shopBanner" class="bg-white rounded-lg shadow p-3 mb-4 hidden">
            <h2 class="text-lg font-bold text-gray-800" id="shopName">दुकान</h2>
            <p class="text-sm text-gray-600" id="shopPhone">📞 9876543210</p>
        </div>

        <div class="bg-white rounded-lg shadow-lg p-4 mb-4">
            <h2 class="text-xl font-bold text-gray-800 mb-3">
                <i class="fas fa-camera text-blue-600"></i> प्रोडक्ट जोड़ें
            </h2>

            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2 text-sm">फोटो खींचें या अपलोड करें</label>
                <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center cursor-pointer" onclick="document.getElementById('photoInput').click()">
                    <i class="fas fa-cloud-upload-alt text-4xl text-gray-400 mb-2"></i>
                    <p class="text-gray-600 text-sm">यहाँ क्लिक करें</p>
                    <input type="file" id="photoInput" accept="image/*" class="hidden" onchange="handlePhotoUpload(event)">
                </div>
                <div id="photoPreview" class="mt-3"></div>
            </div>

            <div id="aiProcessing" class="hidden text-center py-6">
                <div class="loader mx-auto mb-3"></div>
                <p class="text-gray-600 font-semibold text-sm">AI प्रोडक्ट समझ रहा है...</p>
            </div>

            <div id="aiResult" class="hidden fade-in">
                <h3 class="text-lg font-bold text-green-600 mb-3">
                    <i class="fas fa-check-circle"></i> AI तैयार है!
                </h3>

                <div class="mb-3">
                    <img id="studioImage" class="w-full max-w-xs mx-auto rounded-lg shadow" src="" alt="">
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="block text-gray-700 font-semibold mb-1 text-sm">प्रोडक्ट नाम</label>
                        <input type="text" id="productTitle" class="w-full border rounded-lg px-3 py-2 text-sm">
                    </div>

                    <div>
                        <label class="block text-gray-700 font-semibold mb-1 text-sm">कैटेगरी</label>
                        <input type="text" id="productCategory" class="w-full border rounded-lg px-3 py-2 text-sm">
                    </div>

                    <div>
                        <label class="block text-gray-700 font-semibold mb-1 text-sm">विवरण</label>
                        <textarea id="productDescription" rows="3" class="w-full border rounded-lg px-3 py-2 text-sm"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-blue-50 p-3 rounded-lg">
                            <label class="block text-blue-700 font-semibold mb-1 text-xs">थोक ₹</label>
                            <input type="number" id="wholesalePrice" placeholder="₹" class="w-full border rounded px-2 py-1 text-sm">
                        </div>
                        <div class="bg-green-50 p-3 rounded-lg">
                            <label class="block text-green-700 font-semibold mb-1 text-xs">खुदरा ₹</label>
                            <input type="number" id="retailPrice" placeholder="₹" class="w-full border rounded px-2 py-1 text-sm">
                        </div>
                    </div>

                    <button onclick="saveProduct()" class="w-full bg-gradient-to-r from-green-500 to-blue-500 text-white py-2 rounded-lg font-bold text-sm">
                        <i class="fas fa-save"></i> सेव करें
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-lg p-4 mb-4">
            <h2 class="text-xl font-bold text-gray-800 mb-3">
                <i class="fas fa-box-open text-orange-600"></i> प्रोडक्ट (<span id="productCount">0</span>)
            </h2>
            <div id="productsList" class="grid grid-cols-2 gap-3"></div>
            <div id="noProducts" class="text-center py-6 text-gray-500 text-sm">
                <i class="fas fa-inbox text-4xl mb-2"></i>
                <p>कोई प्रोडक्ट नहीं</p>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-lg p-4 mb-4">
            <h2 class="text-xl font-bold text-gray-800 mb-3">
                <i class="fas fa-share-alt text-pink-600"></i> शेयर करें
            </h2>
            <button onclick="shareOnWhatsApp()" class="w-full bg-green-500 text-white py-2 rounded-lg font-bold text-sm">
                <i class="fab fa-whatsapp"></i> WhatsApp पर भेजें
            </button>
        </div>
    </div>

    <div id="shopProfileModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-sm w-full p-4">
            <h2 class="text-xl font-bold text-gray-800 mb-3">दुकान जानकारी</h2>
            <div class="space-y-3">
                <input type="text" id="shopNameInput" placeholder="दुकान का नाम" class="w-full border rounded px-3 py-2 text-sm">
                <input type="tel" id="shopPhoneInput" placeholder="फोन नंबर" class="w-full border rounded px-3 py-2 text-sm">
                <div class="flex gap-2">
                    <button onclick="saveShopProfile()" class="flex-1 bg-blue-600 text-white py-2 rounded text-sm font-semibold">सेव</button>
                    <button onclick="closeShopProfile()" class="flex-1 bg-gray-300 text-gray-700 py-2 rounded text-sm font-semibold">बंद</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
                      </html>
